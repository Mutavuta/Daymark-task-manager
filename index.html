
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daymark | Student Task Manager</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>daymark.</h1>
    <p>Your space to focus.</p>
</header>

<main>
    <section>
        <h2>Make room for what matters.</h2>
        <p>What's on your list today?</p>
    </section>

    <section>
        <h2>Your tasks</h2>

        <form id="taskForm">
            <input
                    type="text"
                    id="taskInput"
                    placeholder="What needs your attention?"
                    required
            >

            <button type="submit">Add task</button>
        </form>

        <ul id="taskList">
        </ul>
    </section>
</main>

<script src="script.js"></script>
</body>
</html>
